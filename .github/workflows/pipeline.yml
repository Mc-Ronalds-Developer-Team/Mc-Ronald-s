name: Pipeline CI/CD (Test y Despliegue)

on:
  push:
    branches:
      - 'hotfix/SusErrores'
    paths:
      - 'back/**'
      - '.github/workflows/**'

jobs:
  # --- TRABAJO 1: PRUEBAS (CI) ---
  test:
    name: Validar Backend (Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Ejecutar Tests con Maven
        working-directory: back/McRonalds
        # Asegúrate de que esta línea esté sola y sin texto extra al final:
        run: mvn clean verify

  # --- TRABAJO 2: DESPLIEGUE (CD) ---
  deploy:
    name: Desplegar a Render
    runs-on: ubuntu-latest
    needs: test # Espera a que el test pase
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    
    steps:
      - name: Activar Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: El secreto RENDER_DEPLOY_HOOK_URL no está configurado."
            exit 1
          fi
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}