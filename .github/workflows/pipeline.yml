name: Pipeline Monorepo (Back & Front)

on:
  push:
    branches:
      - 'hotfix/SusErrores'
    paths:
      - 'back/**'
      - 'front/**'
      - '.github/workflows/**'

jobs:
  # ==========================================
  #  BACKEND (Spring Boot)
  # ==========================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Tests Backend
        working-directory: back/McRonalds
        run: mvn clean verify

  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Invocar Render Hook (Backend)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: Secreto RENDER_DEPLOY_HOOK_URL no encontrado."
            exit 1
          fi
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # ==========================================
  # FRONTEND (React)
  # ==========================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/mcrondaldsfront
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/mcrondaldsfront/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificar Construcción (Build)
        run: npm run build
        env:
          CI: false 

  deploy-frontend:
    name: 🚀 Deploy Frontend
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Invocar Render Hook (Frontend)
        run: |
          if [ -z "${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}" ]; then
             echo "Error: Secreto RENDER_FRONT_DEPLOY_HOOK_URL no encontrado."
             exit 1
          fi
          curl -X POST ${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}