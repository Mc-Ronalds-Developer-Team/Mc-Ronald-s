name: Frontend Pipeline

on:
  push:
    branches:
      - 'hotfix/SusErrores'
    paths:
      - 'front/**'                # Solo vigila la carpeta del frontend
      - '.github/workflows/frontend-ci.yml'

jobs:
  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/mcrondaldsfront # Ruta corregida según tu proyecto
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/mcrondaldsfront/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificar Construcción (Build)
        run: npm run build
        env:
          CI: false # Evita fallos por warnings leves

  deploy-frontend:
    name: 🚀 Deploy Frontend
    runs-on: ubuntu-latest
    needs: test-frontend
    # Solo despliega si estamos en la rama correcta
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Invocar Render Hook (Frontend)
        run: |
          if [ -z "${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}" ]; then
             echo "Error: Secreto RENDER_FRONT_DEPLOY_HOOK_URL no encontrado."
             exit 1
          fi
          curl -X POST ${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}