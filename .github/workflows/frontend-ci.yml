name: Frontend Pipeline

on:
  push:
    branches:
      - 'hotfix/SusErrores'
    paths:
      - 'front/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/mcrondaldsfront
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/mcrondaldsfront/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificar Construcción (Build de prueba)
        run: npm run build
        env:
          CI: false

  build-and-publish:
    name:  Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular nombre de la imagen
        id: image_name
        run: |
          echo "IMAGE_TAG=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/frontend:latest" >> $GITHUB_ENV

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          # OJO: Contexto en la carpeta del frontend
          context: front/mcrondaldsfront
          file: front/mcrondaldsfront/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}

  deploy-frontend:
    name:  Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Invocar Render Hook (Frontend)
        run: |
          if [ -z "${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}" ]; then
             echo "Error: Secreto RENDER_FRONT_DEPLOY_HOOK_URL no encontrado."
             exit 1
          fi
          curl -X POST ${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}