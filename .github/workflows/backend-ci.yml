name: Backend Pipeline

on:
  push:
    branches:
      - 'hotfix/SusErrores'
    paths:
      - 'back/**'
      - '.github/workflows/backend-ci.yml'

# Permisos necesarios para subir paquetes a GHCR
permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Tests
        working-directory: back/McRonalds
        run: mvn clean verify

  build-and-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convierte el nombre del repo a minúsculas para la etiqueta de la imagen
      - name: Calcular nombre de la imagen en minúsculas
        id: image_name
        run: |
          echo "IMAGE_TAG=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend:latest" >> $GITHUB_ENV

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: back/McRonalds
          file: back/McRonalds/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-and-publish # Espera a que la imagen se publique
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Invocar Render Hook (Backend)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: Secreto RENDER_DEPLOY_HOOK_URL no encontrado."
            exit 1
          fi
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}