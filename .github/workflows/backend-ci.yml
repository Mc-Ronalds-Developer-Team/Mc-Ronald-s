name: Backend Pipeline

on:
  push:
    branches:
      - 'hotfix/SusErrores'
    paths:
      - 'back/**'                 # Solo vigila la carpeta del backend
      - '.github/workflows/backend-ci.yml'

jobs:
  test-backend:
    name: Test & Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Tests
        working-directory: back/McRonalds
        run: mvn clean verify

  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    needs: test-backend
    # Solo despliega si estamos en la rama correcta
    if: github.ref == 'refs/heads/hotfix/SusErrores'
    steps:
      - name: Invocar Render Hook (Backend)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: Secreto RENDER_DEPLOY_HOOK_URL no encontrado."
            exit 1
          fi
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}